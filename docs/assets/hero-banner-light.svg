<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" fill="none">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="lightBgGlowCyan" cx="20%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="lightBgGlowEmerald" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15" />
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.01" />
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0" />
    </radialGradient>
    
    <!-- Grid Pattern -->
    <pattern id="lightGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#cbd5e1" stroke-width="0.8" stroke-opacity="0.45" />
      <circle cx="0" cy="0" r="1.2" fill="#0284c7" fill-opacity="0.3" />
    </pattern>

    <!-- Filters -->
    <filter id="lightShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <filter id="lightGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .font-mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Crisp Light Base Background -->
  <rect width="1200" height="400" fill="#f8fafc" />
  <rect width="1200" height="400" fill="url(#lightBgGlowCyan)" />
  <rect width="1200" height="400" fill="url(#lightBgGlowEmerald)" />
  <rect width="1200" height="400" fill="url(#lightGrid)" />

  <!-- Outer Border Frame -->
  <rect x="1" y="1" width="1198" height="398" rx="8" fill="none" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Technical Circuit Coordinates -->
  <g class="font-mono" font-size="11" fill="#64748b">
    <text x="36" y="44">SYS: PORTFOLIO_V2 // THREE_JS: 0.186 // STATUS: OPTIMIZED</text>
    <text x="1164" y="44" text-anchor="end">LOC: 28.4744 N, 77.5040 E</text>
  </g>

  <!-- Left Content Area -->
  <g transform="translate(60, 95)">
    <!-- Verified Badge -->
    <rect x="0" y="0" width="280" height="28" rx="6" fill="#ffffff" stroke="#0891b2" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="14" cy="14" r="4" fill="#059669" />
    <text x="26" y="18" class="font-mono" font-size="11" font-weight="600" fill="#0369a1" letter-spacing="0.5">WORLD MEMORY CHAMPIONSHIP 2023</text>

    <!-- Main Title -->
    <text x="0" y="78" class="font-sans" font-size="46" font-weight="800" fill="#0f172a" letter-spacing="-1">
      PRADYUMNA
    </text>
    <text x="325" y="78" class="font-sans" font-size="46" font-weight="300" fill="#0284c7" letter-spacing="-1">
      : PORTFOLIO
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="112" class="font-sans" font-size="16" font-weight="500" fill="#334155">
      First-Year B.Tech CSE (AI/ML) Student at GL Bajaj ITM, Greater Noida.
    </text>
    <text x="0" y="136" class="font-sans" font-size="14" font-weight="400" fill="#64748b">
      Liquid-glass architecture, GPU-accelerated 3D shaders, and high-performance web systems.
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 175)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="105" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
        <text x="52" y="19" text-anchor="middle" class="font-mono" font-size="11" font-weight="600" fill="#0284c7">Next.js 15</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(115, 0)">
        <rect width="95" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
        <text x="47" y="19" text-anchor="middle" class="font-mono" font-size="11" font-weight="600" fill="#0284c7">React 19</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(220, 0)">
        <rect width="115" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
        <text x="57" y="19" text-anchor="middle" class="font-mono" font-size="11" font-weight="600" fill="#0284c7">TypeScript 5</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(345, 0)">
        <rect width="105" height="30" rx="6" fill="#ffffff" stroke="#059669" stroke-opacity="0.5" stroke-width="1" />
        <text x="52" y="19" text-anchor="middle" class="font-mono" font-size="11" font-weight="600" fill="#047857">Three.js</text>
      </g>
      <!-- Pill 5 -->
      <g transform="translate(460, 0)">
        <rect width="125" height="30" rx="6" fill="#ffffff" stroke="#d97706" stroke-opacity="0.5" stroke-width="1" />
        <text x="62" y="19" text-anchor="middle" class="font-mono" font-size="11" font-weight="600" fill="#b45309">Lenis Smooth</text>
      </g>
    </g>
  </g>

  <!-- Right Visual 3D Liquid Glass Prism -->
  <g transform="translate(940, 205)">
    <!-- Outer ambient circle glow -->
    <circle cx="0" cy="0" r="140" fill="#0284c7" fill-opacity="0.08" filter="url(#lightGlow)" />
    
    <!-- Dynamic Orbit Ring -->
    <ellipse cx="0" cy="0" rx="145" ry="50" fill="none" stroke="#0284c7" stroke-opacity="0.35" stroke-dasharray="6 8" stroke-width="1.5" transform="rotate(-25)" />
    <ellipse cx="0" cy="0" rx="125" ry="42" fill="none" stroke="#059669" stroke-opacity="0.3" stroke-dasharray="4 6" stroke-width="1" transform="rotate(35)" />

    <!-- 3D Polyhedron / Glass Crystal Facets -->
    <!-- Back Facets -->
    <polygon points="0,-105 85,-25 0,105" fill="#e2e8f0" fill-opacity="0.8" stroke="#0284c7" stroke-width="1.2" stroke-opacity="0.7" />
    <polygon points="0,-105 -85,-25 0,105" fill="#f1f5f9" fill-opacity="0.9" stroke="#059669" stroke-width="1.2" stroke-opacity="0.7" />

    <!-- Front Translucent Glass Facets with Specular sheen -->
    <polygon points="0,-105 0,105 50,15" fill="#38bdf8" fill-opacity="0.3" stroke="#0284c7" stroke-width="1.5" stroke-opacity="0.85" />
    <polygon points="0,-105 0,105 -50,15" fill="#34d399" fill-opacity="0.35" stroke="#059669" stroke-width="1.5" stroke-opacity="0.85" />
    
    <!-- Top Highlights -->
    <polygon points="0,-105 50,15 85,-25" fill="#bae6fd" fill-opacity="0.45" stroke="#0369a1" stroke-width="1" stroke-opacity="0.75" />
    <polygon points="0,-105 -50,15 -85,-25" fill="#a7f3d0" fill-opacity="0.45" stroke="#047857" stroke-width="1" stroke-opacity="0.75" />
    
    <!-- Bottom Reflection -->
    <polygon points="0,105 50,15 85,-25" fill="#7dd3fc" fill-opacity="0.3" stroke="#0284c7" stroke-width="1" stroke-opacity="0.7" />
    <polygon points="0,105 -50,15 -85,-25" fill="#6ee7b7" fill-opacity="0.35" stroke="#059669" stroke-width="1" stroke-opacity="0.7" />

    <!-- Glowing Vertex Nodes -->
    <circle cx="0" cy="-105" r="4.5" fill="#0284c7" />
    <circle cx="0" cy="105" r="4.5" fill="#059669" />
    <circle cx="85" cy="-25" r="3.5" fill="#0369a1" />
    <circle cx="-85" cy="-25" r="3.5" fill="#047857" />
    <circle cx="50" cy="15" r="4" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
    <circle cx="-50" cy="15" r="3.5" fill="#ffffff" stroke="#059669" stroke-width="1.5" />
    
    <!-- Floating Orbiting Particles -->
    <circle cx="120" cy="-60" r="2.5" fill="#0284c7" />
    <circle cx="-110" cy="70" r="2.5" fill="#059669" />
    <circle cx="70" cy="95" r="2.5" fill="#d97706" />
  </g>

  <!-- Bottom Technical Footer Bar -->
  <g class="font-mono" font-size="10" fill="#64748b" transform="translate(60, 368)">
    <text x="0" y="0">PERFORMANCE: 60 FPS RAF BUDGET</text>
    <text x="240" y="0">ACCESSIBILITY: WCAG AA / APCA</text>
    <text x="480" y="0">CURSOR: NATIVE SYSTEM</text>
    <text x="700" y="0">MOTION: PREFERS-REDUCED-MOTION SAFE</text>
  </g>
</svg>
