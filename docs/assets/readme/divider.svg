<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 8" width="100%" height="8">
  <defs>
    <linearGradient id="divider-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0" />
      <stop offset="25%" stop-color="#22D3EE" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.85" />
      <stop offset="75%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0" />
    </linearGradient>
    <filter id="div-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" />
    </filter>
  </defs>
  <!-- Background Glow line -->
  <line x1="100" y1="4" x2="1100" y2="4" stroke="url(#divider-grad)" stroke-width="2" filter="url(#div-blur)" />
  <!-- Crisp Center Line -->
  <line x1="50" y1="4" x2="1150" y2="4" stroke="url(#divider-grad)" stroke-width="1" />
  <!-- Center Specular Diamond -->
  <polygon points="600,1 604,4 600,7 596,4" fill="#FFFFFF" opacity="0.9" />
  <circle cx="600" cy="4" r="3" fill="#22D3EE" opacity="0.6" filter="url(#div-blur)" />
</svg>
