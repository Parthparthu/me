<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" fill="none">
  <defs>
    <linearGradient id="archDarkCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0b0f17" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="archBorderCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="archBorderEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="archBorderAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .font-mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Background Canvas -->
  <rect width="1000" height="500" rx="10" fill="#080c14" stroke="#1e293b" stroke-width="1.5" />

  <!-- Title & Legend -->
  <g transform="translate(40, 40)">
    <text x="0" y="0" class="font-sans" font-size="20" font-weight="700" fill="#f8fafc">SYSTEM ARCHITECTURE</text>
    <text x="0" y="22" class="font-mono" font-size="12" fill="#64748b">Unified pipeline connecting Hardware Tiers, 3D WebGL, Virtual-Time Smooth Scroll, and DOM Tokens</text>
  </g>

  <!-- Connector Lines -->
  <path d="M 230 185 L 290 185" stroke="#334155" stroke-width="2" stroke-dasharray="4 4" />
  <path d="M 490 185 L 540 185" stroke="#334155" stroke-width="2" stroke-dasharray="4 4" />
  <path d="M 740 185 L 790 185" stroke="#334155" stroke-width="2" stroke-dasharray="4 4" />

  <path d="M 390 270 L 390 320" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.6" />
  <path d="M 640 270 L 640 320" stroke="#10b981" stroke-width="2" stroke-opacity="0.6" />

  <!-- Column 1: Hardware & Quality Tier Detection -->
  <g transform="translate(40, 95)">
    <rect width="190" height="175" rx="8" fill="url(#archDarkCard)" stroke="#334155" stroke-width="1" />
    <rect x="0" y="0" width="190" height="34" rx="8" fill="#1e293b" fill-opacity="0.5" />
    <text x="16" y="22" class="font-mono" font-size="11" font-weight="600" fill="#38bdf8">01. CAPABILITIES</text>
    
    <g transform="translate(16, 52)" class="font-mono" font-size="11" fill="#94a3b8">
      <text x="0" y="0" font-weight="600" fill="#f1f5f9">detect-gpu</text>
      <text x="0" y="18" fill="#64748b">Tier 0 to 3 Benchmarking</text>
      <text x="0" y="44" font-weight="600" fill="#f1f5f9">Device Pixel Ratio</text>
      <text x="0" y="62" fill="#64748b">Clamped to max 2.0</text>
      <text x="0" y="88" font-weight="600" fill="#f1f5f9">Motion Preference</text>
      <text x="0" y="106" fill="#64748b">prefers-reduced-motion</text>
    </g>
  </g>

  <!-- Column 2: 3D WebGL Canvas Layer -->
  <g transform="translate(290, 95)">
    <rect width="200" height="175" rx="8" fill="url(#archDarkCard)" stroke="url(#archBorderCyan)" stroke-width="1.5" />
    <rect x="0" y="0" width="200" height="34" rx="8" fill="#0891b2" fill-opacity="0.2" />
    <text x="16" y="22" class="font-mono" font-size="11" font-weight="600" fill="#22d3ee">02. 3D WEBGL ENGINE</text>

    <g transform="translate(16, 52)" class="font-mono" font-size="11" fill="#94a3b8">
      <text x="0" y="0" font-weight="600" fill="#f1f5f9">Three.js 0.186</text>
      <text x="0" y="18" fill="#64748b">R3F + Drei Scene Rig</text>
      <text x="0" y="44" font-weight="600" fill="#f1f5f9">Liquid-Glass Meshes</text>
      <text x="0" y="62" fill="#64748b">Polyhedron + Torus + Prism</text>
      <text x="0" y="88" font-weight="600" fill="#f1f5f9">Theme-Reactive Light</text>
      <text x="0" y="106" fill="#64748b">Dynamic Key, Fill, Specular</text>
    </g>
  </g>

  <!-- Column 3: Navigation & Lenis Virtual RAF -->
  <g transform="translate(540, 95)">
    <rect width="200" height="175" rx="8" fill="url(#archDarkCard)" stroke="url(#archBorderEmerald)" stroke-width="1.5" />
    <rect x="0" y="0" width="200" height="34" rx="8" fill="#059669" fill-opacity="0.2" />
    <text x="16" y="22" class="font-mono" font-size="11" font-weight="600" fill="#34d399">03. SMOOTH SCROLL</text>

    <g transform="translate(16, 52)" class="font-mono" font-size="11" fill="#94a3b8">
      <text x="0" y="0" font-weight="600" fill="#f1f5f9">Lenis 1.1.18</text>
      <text x="0" y="18" fill="#64748b">Clamped virtual-time RAF</text>
      <text x="0" y="44" font-weight="600" fill="#f1f5f9">useSmoothScroll Hook</text>
      <text x="0" y="62" fill="#64748b">Interpolated nav targeting</text>
      <text x="0" y="88" font-weight="600" fill="#f1f5f9">Native Cursor &amp; Wheel</text>
      <text x="0" y="106" fill="#64748b">Zero scroll-jacking</text>
    </g>
  </g>

  <!-- Column 4: Next.js 15 DOM & UI -->
  <g transform="translate(790, 95)">
    <rect width="170" height="175" rx="8" fill="url(#archDarkCard)" stroke="#334155" stroke-width="1" />
    <rect x="0" y="0" width="170" height="34" rx="8" fill="#1e293b" fill-opacity="0.5" />
    <text x="16" y="22" class="font-mono" font-size="11" font-weight="600" fill="#38bdf8">04. DOM &amp; ROUTING</text>

    <g transform="translate(16, 52)" class="font-mono" font-size="11" fill="#94a3b8">
      <text x="0" y="0" font-weight="600" fill="#f1f5f9">Next.js 15</text>
      <text x="0" y="18" fill="#64748b">App Router (Turbopack)</text>
      <text x="0" y="44" font-weight="600" fill="#f1f5f9">Command Palette</text>
      <text x="0" y="62" fill="#64748b">Cmd+K Modal &amp; Search</text>
      <text x="0" y="88" font-weight="600" fill="#f1f5f9">Header Dock</text>
      <text x="0" y="106" fill="#64748b">Desktop &amp; Mobile docks</text>
    </g>
  </g>

  <!-- Bottom Spanning Row: Theme & Liquid-Glass System -->
  <g transform="translate(40, 320)">
    <rect width="920" height="135" rx="8" fill="url(#archDarkCard)" stroke="url(#archBorderAmber)" stroke-width="1.5" />
    <rect x="0" y="0" width="920" height="32" rx="8" fill="#d97706" fill-opacity="0.15" />
    <text x="20" y="21" class="font-mono" font-size="11" font-weight="600" fill="#fbbf24">05. UNIVERSAL LIQUID-GLASS &amp; THEME TOKEN ENGINE</text>

    <g transform="translate(20, 52)" class="font-mono" font-size="11" fill="#94a3b8">
      <g transform="translate(0, 0)">
        <text x="0" y="0" font-weight="600" fill="#f1f5f9">CSS Custom Property Tokens</text>
        <text x="0" y="18" fill="#64748b">--bg-base, --glass-surface, --accent-primary</text>
        <text x="0" y="38" fill="#64748b">Zero-FOUC inline head script hydration</text>
      </g>
      <g transform="translate(320, 0)">
        <text x="0" y="0" font-weight="600" fill="#f1f5f9">LiquidGlass Refraction Filter</text>
        <text x="0" y="18" fill="#64748b">feDisplacementMap &amp; feTurbulence SVG</text>
        <text x="0" y="38" fill="#64748b">Backdrop blur 16px + layered dual shadows</text>
      </g>
      <g transform="translate(630, 0)">
        <text x="0" y="0" font-weight="600" fill="#f1f5f9">Accessibility &amp; Standards</text>
        <text x="0" y="18" fill="#64748b">WCAG AA / APCA compliant contrast</text>
        <text x="0" y="38" fill="#64748b">44px hit targets, visible focus rings</text>
      </g>
    </g>
  </g>
</svg>
