<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#F6F8FB" />
    </linearGradient>
    <linearGradient id="sapphireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="borderGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <filter id="softGlowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0369a1" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Clean Off-White Slate Container with Cyan-Blue Rim -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGradLight)" stroke="url(#borderGradLight)" stroke-width="20" filter="url(#softGlowLight)" />
  <rect x="36" y="36" width="440" height="440" rx="100" fill="none" stroke="#0B1220" stroke-opacity="0.06" stroke-width="4" />

  <!-- Monogram P Architecture -->
  <!-- Left Pillar / Stem (Deep Slate 900) -->
  <rect x="148" y="128" width="52" height="256" rx="26" fill="#0B1220" />

  <!-- Top-Right Bowl / Loop (Cyan-Blue Gradient with 52px stroke) -->
  <path d="M174 154 H288 C345.438 154 392 200.562 392 258 C392 315.438 345.438 362 288 362 H174" 
        fill="none" 
        stroke="url(#sapphireGrad)" 
        stroke-width="52" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Luminous Core Node -->
  <circle cx="288" cy="258" r="28" fill="#0369a1" />
  <circle cx="288" cy="258" r="14" fill="#ffffff" />
</svg>
