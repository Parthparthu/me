<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060B18"/>
      <stop offset="100%" stop-color="#0E1626"/>
    </linearGradient>
    <linearGradient id="chart-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="800" fill="url(#bg-grad)"/>

  <!-- Subtle grid lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="800"/>
    <line x1="280" y1="0" x2="280" y2="800"/>
    <line x1="480" y1="0" x2="480" y2="800"/>
    <line x1="680" y1="0" x2="680" y2="800"/>
    <line x1="880" y1="0" x2="880" y2="800"/>
    <line x1="1080" y1="0" x2="1080" y2="800"/>
    <line x1="0" y1="120" x2="1280" y2="120"/>
    <line x1="0" y1="260" x2="1280" y2="260"/>
    <line x1="0" y1="420" x2="1280" y2="420"/>
    <line x1="0" y1="580" x2="1280" y2="580"/>
  </g>

  <!-- Window chrome -->
  <rect x="80" y="60" width="1120" height="680" rx="16" fill="#0A1220" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Header bar -->
  <rect x="80" y="60" width="1120" height="54" rx="16" fill="#0F1A2E"/>
  <rect x="80" y="98" width="1120" height="16" fill="#0F1A2E"/>
  <line x1="80" y1="114" x2="1200" y2="114" stroke="rgba(255,255,255,0.08)"/>

  <!-- Window controls -->
  <circle cx="112" cy="87" r="6" fill="#EF4444" opacity="0.8"/>
  <circle cx="132" cy="87" r="6" fill="#F59E0B" opacity="0.8"/>
  <circle cx="152" cy="87" r="6" fill="#10B981" opacity="0.8"/>

  <!-- Window title / search -->
  <rect x="220" y="73" width="460" height="28" rx="6" fill="#16233B" stroke="rgba(255,255,255,0.08)"/>
  <text x="240" y="91" fill="#6F7B91" font-family="monospace" font-size="12">https://insidertracker.internal/api/v1/filings?ticker=AAPL</text>

  <!-- Live status badge -->
  <rect x="1060" y="75" width="104" height="24" rx="12" fill="rgba(245,158,11,0.12)" stroke="rgba(245,158,11,0.3)"/>
  <circle cx="1076" cy="87" r="3.5" fill="#F59E0B"/>
  <text x="1088" y="91" fill="#F59E0B" font-family="monospace" font-size="11" font-weight="600">EDGAR LIVE</text>

  <!-- Left Sidebar: Feed Ingestion Metrics -->
  <rect x="104" y="134" width="260" height="582" rx="12" fill="#0E1728" stroke="rgba(255,255,255,0.06)"/>
  <text x="124" y="166" fill="#A9B4C7" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="1">DATA PIPELINE</text>
  
  <rect x="124" y="184" width="220" height="68" rx="8" fill="#142036" stroke="rgba(255,255,255,0.04)"/>
  <text x="140" y="208" fill="#6F7B91" font-family="monospace" font-size="11">SEC EDGAR XML Stream</text>
  <text x="140" y="234" fill="#22D3EE" font-family="monospace" font-size="16" font-weight="700">10 req / sec</text>

  <rect x="124" y="264" width="220" height="68" rx="8" fill="#142036" stroke="rgba(255,255,255,0.04)"/>
  <text x="140" y="288" fill="#6F7B91" font-family="monospace" font-size="11">Form 4 Ingested</text>
  <text x="140" y="314" fill="#F2F5FA" font-family="monospace" font-size="16" font-weight="700">14,892 records</text>

  <rect x="124" y="344" width="220" height="68" rx="8" fill="#142036" stroke="rgba(255,255,255,0.04)"/>
  <text x="140" y="368" fill="#6F7B91" font-family="monospace" font-size="11">FastAPI Backend P95</text>
  <text x="140" y="394" fill="#10B981" font-family="monospace" font-size="16" font-weight="700">14.2 ms latency</text>

  <!-- Right Main Panel: Analytics Dashboard -->
  <rect x="384" y="134" width="792" height="260" rx="12" fill="#0E1728" stroke="rgba(255,255,255,0.06)"/>
  <text x="408" y="166" fill="#F2F5FA" font-family="sans-serif" font-size="14" font-weight="700">Insider Purchase &amp; Sale Volume (30D)</text>
  <text x="408" y="184" fill="#6F7B91" font-family="monospace" font-size="11">Automated XBRL/XML schema extraction via Python 3.13</text>

  <!-- Area Chart -->
  <path d="M 420 350 L 460 330 L 520 340 L 580 300 L 640 280 L 700 310 L 760 250 L 820 270 L 880 230 L 940 240 L 1000 210 L 1080 220 L 1140 190 L 1140 360 L 420 360 Z" fill="url(#chart-grad)"/>
  <path d="M 420 350 L 460 330 L 520 340 L 580 300 L 640 280 L 700 310 L 760 250 L 820 270 L 880 230 L 940 240 L 1000 210 L 1080 220 L 1140 190" fill="none" stroke="#F59E0B" stroke-width="2.5"/>

  <!-- Table View: Normalized Form 4 Filings -->
  <rect x="384" y="414" width="792" height="302" rx="12" fill="#0E1728" stroke="rgba(255,255,255,0.06)"/>
  <text x="408" y="444" fill="#F2F5FA" font-family="sans-serif" font-size="13" font-weight="700">Normalized Form 4 Disclosures</text>

  <!-- Table Header -->
  <rect x="408" y="462" width="744" height="28" rx="4" fill="#142036"/>
  <text x="424" y="480" fill="#6F7B91" font-family="monospace" font-size="11">DATE</text>
  <text x="500" y="480" fill="#6F7B91" font-family="monospace" font-size="11">TICKER</text>
  <text x="580" y="480" fill="#6F7B91" font-family="monospace" font-size="11">INSIDER / ROLE</text>
  <text x="780" y="480" fill="#6F7B91" font-family="monospace" font-size="11">TYPE</text>
  <text x="860" y="480" fill="#6F7B91" font-family="monospace" font-size="11">SHARES</text>
  <text x="980" y="480" fill="#6F7B91" font-family="monospace" font-size="11">PRICE</text>
  <text x="1080" y="480" fill="#6F7B91" font-family="monospace" font-size="11">VALUE</text>

  <!-- Row 1 -->
  <text x="424" y="516" fill="#A9B4C7" font-family="monospace" font-size="11">2026-03-24</text>
  <text x="500" y="516" fill="#22D3EE" font-family="monospace" font-size="11" font-weight="700">AAPL</text>
  <text x="580" y="516" fill="#F2F5FA" font-family="monospace" font-size="11">Tim Cook (CEO)</text>
  <text x="780" y="516" fill="#EF4444" font-family="monospace" font-size="11">S - Sale</text>
  <text x="860" y="516" fill="#A9B4C7" font-family="monospace" font-size="11">120,000</text>
  <text x="980" y="516" fill="#A9B4C7" font-family="monospace" font-size="11">$224.50</text>
  <text x="1080" y="516" fill="#F59E0B" font-family="monospace" font-size="11" font-weight="600">$26.94M</text>

  <!-- Row 2 -->
  <line x1="408" y1="532" x2="1152" y2="532" stroke="rgba(255,255,255,0.04)"/>
  <text x="424" y="556" fill="#A9B4C7" font-family="monospace" font-size="11">2026-03-22</text>
  <text x="500" y="556" fill="#22D3EE" font-family="monospace" font-size="11" font-weight="700">NVDA</text>
  <text x="580" y="556" fill="#F2F5FA" font-family="monospace" font-size="11">Jensen Huang (Director)</text>
  <text x="780" y="556" fill="#EF4444" font-family="monospace" font-size="11">S - Sale</text>
  <text x="860" y="556" fill="#A9B4C7" font-family="monospace" font-size="11">50,000</text>
  <text x="980" y="556" fill="#A9B4C7" font-family="monospace" font-size="11">$138.20</text>
  <text x="1080" y="556" fill="#F59E0B" font-family="monospace" font-size="11" font-weight="600">$6.91M</text>

  <!-- Row 3 -->
  <line x1="408" y1="572" x2="1152" y2="572" stroke="rgba(255,255,255,0.04)"/>
  <text x="424" y="596" fill="#A9B4C7" font-family="monospace" font-size="11">2026-03-19</text>
  <text x="500" y="596" fill="#22D3EE" font-family="monospace" font-size="11" font-weight="700">MSFT</text>
  <text x="580" y="596" fill="#F2F5FA" font-family="monospace" font-size="11">Satya Nadella (CEO)</text>
  <text x="780" y="596" fill="#10B981" font-family="monospace" font-size="11">P - Purchase</text>
  <text x="860" y="596" fill="#A9B4C7" font-family="monospace" font-size="11">25,000</text>
  <text x="980" y="596" fill="#A9B4C7" font-family="monospace" font-size="11">$448.10</text>
  <text x="1080" y="596" fill="#10B981" font-family="monospace" font-size="11" font-weight="600">$11.20M</text>
</svg>
