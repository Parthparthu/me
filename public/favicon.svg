<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <style>
    .bg { fill: #0a0c10; }
    .border { stroke: rgba(255, 255, 255, 0.16); }
    .letter { fill: #f1f5f9; }
    .dot { fill: #0ea5e9; }
    @media (prefers-color-scheme: light) {
      .bg { fill: #ffffff; }
      .border { stroke: rgba(0, 0, 0, 0.16); }
      .letter { fill: #0f172a; }
      .dot { fill: #0284c7; }
    }
  </style>
  <rect class="bg" width="32" height="32" rx="8" />
  <rect class="border" x="0.75" y="0.75" width="30.5" height="30.5" rx="7.25" fill="none" stroke-width="1.5" />
  <text class="letter" x="8.5" y="22.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="700">P</text>
  <circle class="dot" cx="22.5" cy="21.5" r="2.25" />
</svg>
